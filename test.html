<!DOCTYPE html>
<html>
<head>
  <title>Supabase Test</title>
</head>
<body>
  <h1>Testing the Supabase telephone...</h1>
  <p id="result">Please wait...</p>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Direct connection test
    const SUPABASE_URL = 'https://obfeamgcbxbzedilnywi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VG_b67vfQSRnPQl0Ht4AnA_1rjPtzz-';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function testConnection() {
      try {
        const { data, error } = await supabaseClient.from('profiles').select('count').limit(1)
        
        if (error) {
          document.getElementById('result').innerText = 'Problem: ' + error.message
          console.error(error)
        } else {
          document.getElementById('result').innerText = 'Good news! The telephone is working.'
        }
      } catch (err) {
        document.getElementById('result').innerText = 'Big problem: ' + err.message
        console.error(err)
      }
    }

    testConnection()
  </script>
</body>
</html>

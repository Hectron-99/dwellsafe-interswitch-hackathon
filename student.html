<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DwellSafe - Student Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .header h2 { margin: 0; color: #2c3e50; }
    button.logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.logout-btn:hover { background: #c0392b; }
    .container { margin-top: 20px; }
    .hostel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
    .hostel-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .hostel-card h4 { margin: 0 0 10px 0; color: #2c3e50; font-size: 18px; }
    .price { color: #27ae60; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
    .location { color: #7f8c8d; font-size: 14px; margin-bottom: 10px; }
    .desc { font-size: 14px; margin-bottom: 15px; color: #34495e; }
    a.video-link { display: inline-block; background: #3498db; color: white; padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold; }
    a.video-link:hover { background: #2980b9; }
  </style>
</head>
<body>

  <div class="header">
    <h2>DwellSafe - Student Portal</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <h3>Available Hostels Near EKSU</h3>
    <div id="hostel-container" class="hostel-grid">
      <p>Loading available hostels...</p>
    </div>
  </div>

  <!-- Supabase Library & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/supabase.js"></script>

  <script>
    // Protect page: redirect to login if not logged in
    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
      } else {
        loadHostels();
      }
    }
    checkUser();

    async function loadHostels() {
      const { data: hostels, error } = await supabaseClient
        .from('hostels')
        .select('*');

      const container = document.getElementById('hostel-container');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p style="color:red;">Error loading hostels: ${error.message}</p>`;
        return;
      }

      if (!hostels || hostels.length === 0) {
        container.innerHTML = `<p>No hostels listed yet. Check back soon!</p>`;
        return;
      }

      hostels.forEach(hostel => {
        const card = document.createElement('div');
        card.className = 'hostel-card';
        
        let videoButton = '';
        if (hostel.video_url) {
          videoButton = `<a href="${hostel.video_url}" target="_blank" class="video-link">🎥 Watch Video Walkthrough</a>`;
        }

        card.innerHTML = `
          <h4>${hostel.name}</h4>
          <div class="location">📍 ${hostel.location}</div>
          <div class="price">₦${Number(hostel.price).toLocaleString()} / year</div>
          <div class="desc">${hostel.description || 'No description provided.'}</div>
          ${videoButton}
        `;
        container.appendChild(card);
      });
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
